name: Aggiornamento quotidiano

# GitHub programma in UTC, quindi due appuntamenti: 05:00 UTC copre
# l'ora legale italiana, 06:00 UTC quella solare.
#
# ATTENZIONE: GitHub non fa partire i cron in orario. Sotto carico
# arrivano con mezz'ora o un'ora di ritardo, ed è normale. La versione
# precedente pretendeva che a Roma fossero *le sette in punto* e
# scartava tutto il resto: dal 30 luglio in poi non è passata più
# nessuna esecuzione e le notizie sono rimaste ferme.
#
# Ora il criterio non è l'orologio ma il calendario: si aggiorna una
# volta per giorno romano, e il secondo appuntamento serve solo se il
# primo è saltato.
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:        # per lanciarlo a mano quando serve

permissions:
  contents: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Si è già aggiornato oggi?
        id: ora
        run: |
          OGGI=$(TZ=Europe/Rome date +%F)
          ULTIMO=$(TZ=Europe/Rome date -d "$(node -p "require('./data/notizie.json').aggiornato")" +%F 2>/dev/null || echo "mai")
          echo "Oggi a Roma è il $OGGI; l'ultimo aggiornamento è del $ULTIMO."
          if [ "$ULTIMO" = "$OGGI" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "procedi=no" >> "$GITHUB_OUTPUT"
            echo "Già fatto per oggi: questa esecuzione si ferma qui."
          else
            echo "procedi=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ora.outputs.procedi == 'si'
        with:
          node-version: '22'

      - name: Arricchisci il catalogo (TMDB + OMDb)
        if: steps.ora.outputs.procedi == 'si'
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: node tools/enrich.mjs

      - name: Raccogli la rassegna stampa
        if: steps.ora.outputs.procedi == 'si'
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node tools/notizie.mjs

      - name: Prepara le schede da redigere
        if: steps.ora.outputs.procedi == 'si'
        run: node tools/schede.mjs

      - name: Scoperte del giorno e presentazioni da scrivere
        if: steps.ora.outputs.procedi == 'si'
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node tools/scoperte.mjs

      - name: Date ancora senza uscita italiana
        if: steps.ora.outputs.procedi == 'si'
        run: node tools/date-da-controllare.mjs

      - name: Pubblica se qualcosa è cambiato
        if: steps.ora.outputs.procedi == 'si'
        run: |
          git config user.name  "Cineteca bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna novità: niente da pubblicare."
          else
            # La versione degli asset cambia solo quando cambiano i dati,
            # così il service worker dei client si accorge dell'aggiornamento.
            V=$(date -u +%Y%m%d%H%M)
            sed -i -E "s/v=[0-9]{8,12}/v=$V/g" index.html
            sed -i -E "s/cineteca-v[0-9]+/cineteca-v$V/" sw.js
            git add index.html sw.js
            git commit -m "Aggiornamento quotidiano: voti, incassi, streaming, notizie"
            git push
            echo "Pubblicato."
          fi
