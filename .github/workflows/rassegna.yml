name: Rassegna stampa

# Una volta al giorno basta. La raccolta dei feed la fa già
# l'aggiornamento quotidiano (aggiorna.yml) alle 7 di Roma; questo
# workflow serve al passo dopo: la routine mattutina di Claude Code
# scrive data/curatela.json e fa push, e quel push fa ripartire la
# rassegna subito, così le traduzioni si vedono al momento. (I push
# del bot stesso non rifanno partire niente: GitHub ignora i propri.)
on:
  push:
    paths:
      - 'data/curatela.json'
      - 'data/schede.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara le schede da redigere
        run: node tools/schede.mjs

      - name: Raccogli la rassegna
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node tools/notizie.mjs

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name  "Cineteca bot"
          git config user.email "actions@github.com"
          git add data/notizie.json data/da-curare.json data/curatela.json data/da-redigere.json data/schede.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Rassegna: aggiornamento"
            git pull --rebase
            git push
          fi
