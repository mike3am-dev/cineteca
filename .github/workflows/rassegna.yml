name: Rassegna stampa

# La rassegna vive di ore, non di giorni: un feed letto una volta
# al mattino è già vecchio a pranzo. Ogni tre ore, leggero — solo
# i feed e TMDB, niente arricchimento del catalogo. L'aggiornamento
# quotidiano continua a farla anche lui, non fa male.
on:
  schedule:
    - cron: '17 */3 * * *'
  # La routine mattutina di Claude Code scrive data/curatela.json e
  # fa push: quel push fa ripartire la rassegna subito, così le
  # traduzioni si vedono al momento e non tre ore dopo. (I push del
  # bot stesso non rifanno partire niente: GitHub ignora i propri.)
  push:
    paths:
      - 'data/curatela.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Raccogli la rassegna
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node tools/notizie.mjs

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name  "Cineteca bot"
          git config user.email "actions@github.com"
          git add data/notizie.json data/da-curare.json data/curatela.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Rassegna: aggiornamento"
            git pull --rebase
            git push
          fi
